name: Sync LessonFlow from Yandex

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      YANDEX_TOKEN: ${{ secrets.YANDEX_TOKEN }}
      YANDEX_FILE_PATH: ${{ vars.YANDEX_FILE_PATH }}
      YANDEX_PUBLIC_URL: ${{ vars.YANDEX_PUBLIC_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync PLAN sheet
        run: python3 scripts/sync_yandex.py

      - name: Commit only when data changed
        run: |
          if [ -z "$(git status --porcelain -- data/lessons.json assets/generated)" ]; then
            echo "No changes."
            exit 0
          fi

          git config user.name "lessonflow-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/lessons.json assets/generated
          git commit -m "Sync LessonFlow from PLAN"
          git push
