<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700"><rect width="1000" height="700" rx="40" fill="#F7F3FF"/><rect x="50" y="45" width="900" height="610" rx="30" fill="#fff"/><text x="90" y="120" font-family="Arial" font-size="26" font-weight="700" fill="#7659F5">TEXTBOOK • EXERCISE 4</text><text x="90" y="188" font-family="Arial" font-size="46" font-weight="800" fill="#25212D">Daily routine</text><text x="90" y="242" font-family="Arial" font-size="25" fill="#746D7D">Complete the sentences with the correct verb.</text><g font-family="Arial" font-size="29" fill="#332E39"><text x="105" y="335">1. I __________ at seven o'clock.</text><text x="105" y="405">2. Then I __________ breakfast.</text><text x="105" y="475">3. I __________ to school at eight.</text><text x="105" y="545">4. I __________ my homework after school.</text></g><rect x="90" y="590" width="820" height="43" rx="16" fill="#F3EEFF"/><text x="120" y="620" font-family="Arial" font-size="21" font-weight="700" fill="#7659F5">get up</text><text x="250" y="620" font-family="Arial" font-size="21" font-weight="700" fill="#2CAFA8">have</text><text x="355" y="620" font-family="Arial" font-size="21" font-weight="700" fill="#E9864B">go</text><text x="430" y="620" font-family="Arial" font-size="21" font-weight="700" fill="#E15F82">do</text></svg>